<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;border:1px solid #EEEEEC;border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04);height:{{ h }};display:flex;flex-direction:column;gap:14px;overflow:hidden;">
  <div style="height:12px;width:42%;border-radius:6px;background:linear-gradient(90deg,#F1F1EF 25%,#F8F8F6 50%,#F1F1EF 75%);background-size:450px 100%;animation:folioShimmer 1.4s infinite linear;"></div>
  <div style="height:26px;width:64%;border-radius:8px;background:linear-gradient(90deg,#F1F1EF 25%,#F8F8F6 50%,#F1F1EF 75%);background-size:450px 100%;animation:folioShimmer 1.4s infinite linear;"></div>
  <div style="height:10px;width:34%;border-radius:6px;background:linear-gradient(90deg,#F1F1EF 25%,#F8F8F6 50%,#F1F1EF 75%);background-size:450px 100%;animation:folioShimmer 1.4s infinite linear;"></div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:11px;">
    <div style="height:9px;width:100%;border-radius:6px;background:linear-gradient(90deg,#F4F4F2 25%,#FAFAF8 50%,#F4F4F2 75%);background-size:450px 100%;animation:folioShimmer 1.4s infinite linear;"></div>
    <div style="height:9px;width:88%;border-radius:6px;background:linear-gradient(90deg,#F4F4F2 25%,#FAFAF8 50%,#F4F4F2 75%);background-size:450px 100%;animation:folioShimmer 1.4s infinite linear;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:140},&quot;h&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;118px&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
